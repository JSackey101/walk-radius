name: Claude Review

# Claude reviews every non-draft PR, re-reviews on each push, responds to each
# Sourcery finding, and replies when the repo owner answers in any review thread.
# Real bugs are tagged [blocking]; the "gate" step counts unresolved threads whose
# latest Claude comment is [blocking] and sets the `claude-review` commit status,
# which the "Protect main" ruleset requires.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'sourcery-ai[bot]') ||
       (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.in_reply_to_id != null))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level so skipped runs (e.g. bot comments) don't take the slot and
    # cancel a queued review or reply.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    steps:
      - name: Mark review pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending -f context=claude-review -f description="Claude is reviewing" >/dev/null

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          classify_inline_comments: "false"
          # Sourcery's review event is sent by its bot account; the action ignores
          # bots unless listed here.
          allowed_bots: "sourcery-ai,sourcery-ai[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            EVENT: ${{ github.event_name }}
            TRIGGER COMMENT ID: ${{ github.event.comment.id }}
            TRIGGER REVIEW ID: ${{ github.event.review.id }}

            You are the code reviewer for this PR. The PR head is checked out in
            the working directory with full git history.

            ## Severity: what may block
            Start every inline comment with exactly one tag:
            - `[blocking]` ONLY for a real bug: wrong behaviour, a crash, data loss,
              a security hole, or a broken build/test. You must be able to describe
              the concrete input or situation that goes wrong.
            - `[suggestion]` for anything else worth saying (design, readability,
              performance that does not break anything, missing tests).
            - `[nit]` for minor style points. Use sparingly.
            Style, naming and formatting are never blocking. When unsure, do not block.

            The gate counts a thread as blocking when it is unresolved and YOUR most
            recent comment in it starts with `[blocking]`. So every reply you post
            in a thread must start with a tag too: `[blocking]` if you consider the
            thread a real bug that is still unfixed, otherwise `[suggestion]` or
            `[nit]`. Resolve a thread when nothing is left to do in it.

            ## Other reviewers
            sourcery-ai also reviews PRs. Treat its findings as input, not truth:
            check each one against the code yourself. Never @-mention sourcery-ai
            and never reply to its replies (only to its thread-starting comments),
            so the two bots do not talk to each other in a loop.

            ## Responding to a review comment (used below)
            Reply in a thread with:
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<first comment databaseId>/replies -f body='...'

            ## Step 1: load the existing review state
            Fetch all review threads, including resolved state and every reply.
            This is your source of truth for every step below; do not page through
            the REST review-comments API.
            gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100){nodes{id isResolved path line comments(last:100){nodes{databaseId author{login} body createdAt}}}}}}}' -f o=${{ github.repository_owner }} -f r=${{ github.event.repository.name }} -F n=${{ github.event.pull_request.number }}

            ## How to handle each kind of open item
            (A) Owner reply you have not answered (the owner's comment is newer
                than your latest comment in that thread). Read the whole thread and
                the code it refers to, then reply:
                - Their argument is sound (intentional behaviour, the finding misread
                  the code, the risk is acceptable): say so briefly and resolve the
                  thread with the resolveReviewThread GraphQL mutation.
                - The bug still stands: start with `[blocking]`, explain why with
                  the concrete failing case, and leave the thread open.
                - A question: answer it (a ```suggestion block is fine).
            (B) sourcery-ai thread you have not replied to. Check the finding
                against the code and reply once:
                - Real bug: `[blocking]` + confirm with the concrete failing case.
                - Valid but not a bug: `[suggestion]` or `[nit]` + one line on
                  whether it is worth doing.
                - Wrong or not applicable: `[nit]` + explain briefly why, then
                  resolve the thread.

            ## Step 2: catch up (every EVENT)
            Another run for this PR may have been dropped from the queue, so in
            every run handle ALL open (A) and (B) items found in step 1, not only
            the one that triggered this run.

            ## Step 3: event-specific work
            - EVENT pull_request_review_comment: the item containing comment
              TRIGGER COMMENT ID is already covered by step 2. Do nothing more.
            - EVENT pull_request_review: sourcery-ai submitted review TRIGGER REVIEW
              ID; its inline threads are covered by step 2. If the review body
              (gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/<id>)
              has overall comments, address them in the summary comment (see
              below). Do not review the diff and do NOT approve in this mode.
            - EVENT pull_request: full review.
              1. For each UNRESOLVED thread (yours or sourcery-ai's) not handled in
                 step 2: check the current code and commits since (git log,
                 git diff). If addressed, reply naming the commit that fixed it
                 and resolve the thread. Otherwise leave it.
              2. Review the full diff (gh pr diff) against the base branch. Post
                 NEW inline comments with
                 mcp__github_inline_comment__create_inline_comment (confirmed: true)
                 only for problems not already covered by an existing thread. Do
                 not repeat resolved points.
              3. Update the summary comment (see below).
              4. Only in this mode, if no unresolved thread has your latest comment
                 tagged [blocking], approve:
                 gh pr review ${{ github.event.pull_request.number }} --approve --body "No blocking issues."
                 If that command fails, ignore it.

            ## Summary comment
            Keep exactly one top-level summary comment, created or updated with:
            gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body '...'
            It says what the PR does, the counts of open blocking / suggestion
            threads (including sourcery-ai threads you have tagged), and a
            one-line verdict.

            Keep comments short and specific. Only post GitHub comments; do not put
            review text in your final message.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Read,Glob,Grep"

      - name: Gate on unresolved [blocking] threads
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          data=$(gh api graphql \
            -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100){nodes{isResolved comments(last:100){nodes{author{login} body}}}}}}}' \
            -f o='${{ github.repository_owner }}' -f r='${{ github.event.repository.name }}' -F n=${{ github.event.pull_request.number }})
          # Report on the commit this run reviewed, not the current head: if a
          # push landed meanwhile, its own run marks that commit pending/done.
          head='${{ github.event.pull_request.head.sha }}'
          # Blocking = unresolved thread whose latest Claude comment is [blocking].
          blocking=$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]
            | select(.isResolved | not)
            | [.comments.nodes[] | select((.author.login // "") == "claude")] | last
            | select(. != null)
            | select(.body | test("^\\s*\\**\\[blocking\\]"; "i"))] | length' <<<"$data")

          # The action skips itself (and still reports success) when a PR changes
          # this workflow file, so don't let that look like a clean review.
          if ! git diff --quiet "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- .github/workflows/claude-review.yml; then
            state=success; desc="Review workflow changed: Claude skipped, review it yourself"
          elif [ "$CLAUDE_OUTCOME" != "success" ]; then
            state=error; desc="Claude review did not complete; re-run the job"
          elif [ "$blocking" -gt 0 ]; then
            state=failure; desc="$blocking unresolved blocking issue(s)"
          else
            state=success; desc="No unresolved blocking issues"
          fi
          echo "$desc"
          gh api "repos/${{ github.repository }}/statuses/$head" \
            -f state="$state" -f context=claude-review -f description="$desc" >/dev/null
          [ "$state" = success ]
